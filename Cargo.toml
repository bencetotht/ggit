[package]
name = "ggit"
version = "0.1.0"
edition = "2021"
description = "Global Git tracking and management CLI"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
comfy-table = "7.1"
dirs = "6.0"
indicatif = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
